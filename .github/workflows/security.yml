name: Security

# Scheduled + on-demand security scans: secret scanning (gitleaks) and
# advisory scanning (cargo-audit). Runs on PRs, on push to main, and weekly so
# newly-disclosed advisories are caught even without a code change.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every Monday 05:00 UTC.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks CLI is free; the gitleaks-action wrapper requires a paid
      # license on GitHub organization accounts. Install the version pinned in
      # .mise.toml via mise rather than a bespoke curl|tar shell pipeline.
      - name: Install gitleaks (mise)
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: gitleaks
      - name: gitleaks
        run: gitleaks detect --no-banner --redact --config .gitleaks.toml

  audit:
    name: cargo-audit (advisories)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-audit
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit --deny warnings
